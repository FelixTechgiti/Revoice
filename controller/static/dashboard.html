<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Revoice Device Management</title>
  <link rel="icon" type="image/svg+xml" href="static/favicon.svg" />
  <style>
    /* Instrument Sans for the interface, IBM Plex Mono for every value,
       label and log line. Both SIL OFL, both fetched at image build time
       into static/vendor/fonts (see controller/Dockerfile) — no CDN at
       runtime.

       Instrument Sans ships one variable latin file that serves 400, 500
       and 600; Plex Mono needs a file per weight.

       'DM Sans' and 'DM Mono' are declared as aliases of the same files.
       They are not still installed — around 185 inline style objects in
       dashboard.jsx name them, and re-typing those is the work of the
       panes that follow rather than a prerequisite for the typeface
       changing. The aliases retire with the last call site. */
    @font-face { font-family: 'Instrument Sans'; font-weight: 400 600; src: url('static/vendor/fonts/instrument-sans.woff2') format('woff2'); }
    @font-face { font-family: 'IBM Plex Mono'; font-weight: 400; src: url('static/vendor/fonts/plex-mono-400.woff2') format('woff2'); }
    @font-face { font-family: 'IBM Plex Mono'; font-weight: 500; src: url('static/vendor/fonts/plex-mono-500.woff2') format('woff2'); }
    @font-face { font-family: 'DM Sans'; font-weight: 400 600; src: url('static/vendor/fonts/instrument-sans.woff2') format('woff2'); }
    @font-face { font-family: 'DM Mono'; font-weight: 400; src: url('static/vendor/fonts/plex-mono-400.woff2') format('woff2'); }
    @font-face { font-family: 'DM Mono'; font-weight: 500; src: url('static/vendor/fonts/plex-mono-500.woff2') format('woff2'); }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    /* ── Tokens ───────────────────────────────────────────────────────
       Every colour the dashboard chrome uses.

       The palette is "Instrument im Wohnraum": a warm near-black (or warm
       paper) ground, hairline borders, flat surfaces, and colour reserved
       for state. Two signal colours carry the whole product, because one
       Dot does two jobs and they must never be confused:

         --voice   green   it is listening / thinking / answering
         --media   blue    it is playing music

       Every text level clears 4.5:1 on its own ground. --faint (#575249
       dark, #ded7c9 light) is NOT a text colour — it is for strokes, dots
       and the em-dash placeholder. Putting words in it is the one way to
       break the contrast rule while everything still looks deliberate.

       There are no shadow or gradient tokens any more. --shadow-*, --sheen
       and the rest survive as none/transparent so the call sites that still
       name them stay valid while the panes are converted; a new call site
       should not reach for them.

       Three things are deliberately NOT themed, because theming them would
       be wrong rather than merely unfinished:
         - the LED colour pickers in DeviceConfigForm: those hexes are
           values sent to the hardware, not styling.
         - Shell's xterm theme: a 16-colour contract terminal programs
           address by index.
         - the console ground and its role colours (--console-*): the
           console stays a lit dark panel in BOTH themes, so its text has
           to be light-on-dark even while the page around it is paper.
           That is why they are separate tokens rather than aliases of
           --voice/--warn/--error, which invert with the theme.

       LedRing and DeviceDiagram used to be on that list. They no longer
       draw the black plastic of an Echo Dot — they are chrome now, so
       their colours belong here.

       Adding a value at a call site instead of here is how this once got
       to 126 distinct hexes. Add it here. */
    :root, :root[data-theme="light"] {
      /* Ground and surfaces */
      --bg:          #f7f4ee;
      --surface:     #fffdf8;
      --surface-alt: #f9f6f0;
      --raised:      #ebe6db;

      /* Borders. Two weights: the hairline everything is divided by, and
         the one an active or emphasised element is drawn with. */
      --line:        #ded7c9;
      --line-strong: #c9c1b0;

      /* Text, loudest to quietest. --faint is strokes only. */
      --text:   #1b1a17;
      --text2:  #53504a;
      --muted:  #6d6860;
      --faint:  #ded7c9;
      --empty:  #8c8478;

      /* Voice — listening, thinking, speaking; and the primary action. */
      --voice:      #0d6e4f;
      --voice-hi:   #0a5a41;
      --voice-bg:   #e4f0ea;
      --voice-line: #b9d8ca;

      /* Media — the music plane. */
      --media:      #245fbf;
      --media-bg:   #e7eefb;
      --media-line: #b6cbeb;
      --media-card: #c9d8ef;
      --media-face: #f6f8fc;

      /* Waiting for you, update available. */
      --warn:      #9a5a0c;
      --warn-bg:   #fdf6ea;
      --warn-line: #e6d3b0;

      /* Muted, offline, refused. */
      --error:      #a8372a;
      --error-bg:   #fbeae6;
      --error-line: #eec3b8;

      /* Text on a --voice ground. */
      --on-accent: #f7f4ee;

      /* Bar tracks and meter grounds. */
      --track: #e4ddcf;

      /* The console / log surface. Dark in both themes — see the note
         above; these are the only role colours that do not invert. */
      --console-bg:     #0c0d0c;
      --console-line:   #1e201d;
      --console-line-2: #2c2f2b;
      --console-text:   #b8b2a8;
      --console-dim:    #7d7770;
      --console-voice:  #4ad9a4;
      --console-media:  #7fb3ff;
      --console-warn:   #e8a13c;
      --console-error:  #e8705c;

      /* ── Compatibility aliases ──────────────────────────────────────
         The old token names, re-pointed at the new palette so the panes
         that still use them come across with it instead of stranding on
         the previous one. They are retired pane by pane; nothing new
         should name them. */
      --card:        var(--surface);
      --sunken:      var(--bg);
      --border:      var(--line);
      --border-soft: var(--line);
      --border-hard: var(--line-strong);
      --ok:          var(--voice);
      --error-deep:  var(--error-line);
      --on-error:    var(--error);
      --notice-bg:   var(--warn-bg);
      --notice-line: var(--warn-line);
      --accent:      var(--media);
      --accent-hi:   var(--media);
      --accent-deep: var(--media-line);
      --accent-lit:  var(--media);
      --accent-tint: var(--media-bg);
      --accent-line: var(--media-line);
      --lcd-bg:    var(--console-bg);
      --lcd-face:  var(--console-bg);
      --lcd-deep:  var(--console-bg);
      --lcd-line:  var(--console-line);
      --lcd-faint: var(--console-line-2);
      --lcd-green: var(--console-voice);
      --lcd-amber: var(--console-warn);
      --lcd-dim:   var(--console-dim);
      --shadow-card:  none;
      --shadow-hover: none;
      --shadow-inset: none;
      --sheen:        transparent;
      --hairline:     var(--surface-alt);
    }

    /* Dark. Not an inversion — the warm near-black is this product's own
       identity, and the signal colours are lifted rather than reused:
       #0d6e4f on this ground is unreadable, #4ad9a4 on paper is a
       highlighter. */
    :root[data-theme="dark"] {
      --bg:          #12110f;
      --surface:     #1a1917;
      --surface-alt: #1e1c1a;
      --raised:      #221f1c;

      --line:        #2c2926;
      --line-strong: #3a3632;

      --text:   #f2efe9;
      --text2:  #b8b2a8;
      --muted:  #a39c91;
      --faint:  #575249;
      --empty:  #575249;

      --voice:      #4ad9a4;
      --voice-hi:   #7ce9c0;
      --voice-bg:   #163026;
      --voice-line: #24503f;

      --media:      #7fb3ff;
      --media-bg:   #182333;
      --media-line: #2f4a70;
      --media-card: #2f3a4d;
      --media-face: #161b24;

      --warn:      #e8a13c;
      --warn-bg:   #2a1d1a;
      --warn-line: #4a2f28;

      --error:      #e8705c;
      --error-bg:   #2e1b18;
      --error-line: #5a332b;

      --on-accent: #0b1a14;

      --track: #2c2926;

      --console-bg:     #0c0d0c;
      --console-line:   #1e201d;
      --console-line-2: #2c2f2b;
      --console-text:   #b8b2a8;
      --console-dim:    #7d7770;
      --console-voice:  #4ad9a4;
      --console-media:  #7fb3ff;
      --console-warn:   #e8a13c;
      --console-error:  #e8705c;

      --card:        var(--surface);
      --sunken:      var(--bg);
      --border:      var(--line);
      --border-soft: var(--line);
      --border-hard: var(--line-strong);
      --ok:          var(--voice);
      --error-deep:  var(--error-line);
      --on-error:    var(--error);
      --notice-bg:   var(--warn-bg);
      --notice-line: var(--warn-line);
      --accent:      var(--media);
      --accent-hi:   var(--media);
      --accent-deep: var(--media-line);
      --accent-lit:  var(--media);
      --accent-tint: var(--media-bg);
      --accent-line: var(--media-line);
      --lcd-bg:    var(--console-bg);
      --lcd-face:  var(--console-bg);
      --lcd-deep:  var(--console-bg);
      --lcd-line:  var(--console-line);
      --lcd-faint: var(--console-line-2);
      --lcd-green: var(--console-voice);
      --lcd-amber: var(--console-warn);
      --lcd-dim:   var(--console-dim);
      --shadow-card:  none;
      --shadow-hover: none;
      --shadow-inset: none;
      --sheen:        transparent;
      --hairline:     var(--surface-alt);
    }

    html, body { height: 100%; background: var(--bg); }
    /* No transition on the toggle itself — a 200ms cross-fade of an
       entire dense dashboard reads as a glitch, not a flourish. */

    /* ── Components ───────────────────────────────────────────────────
       The repeated chrome, as classes rather than inline style objects, so
       it can be retuned here without touching React. Declarations are ports
       of what was inline — same values, same result.

       Only genuinely repeated, structural things belong here. One-off
       layout stays inline where it is read next to the markup it positions;
       moving that into CSS trades an inline object for a class name plus a
       rule somewhere else, which is not an improvement. */

    /* Round icon control in the header: theme, settings, sign out. */
    .em-iconbtn {
      display: inline-flex; align-items: center; justify-content: center;
      width: 30px; height: 30px; padding: 0;
      background: var(--surface); border: 1px solid var(--line);
      border-radius: 50%; cursor: pointer;
      font-family: 'IBM Plex Mono', monospace; font-size: 13px; line-height: 1;
      color: var(--text2);
      transition: background 0.12s, border-color 0.12s, color 0.12s;
    }
    .em-iconbtn:hover:not(:disabled) { background: var(--raised); border-color: var(--voice); color: var(--voice); }
    .em-iconbtn:active:not(:disabled) { background: var(--raised); }
    .em-iconbtn:disabled { cursor: default; opacity: 0.5; }
    /* Accent variant for the two actions that DO something to the fleet
       (check for updates, deploy) as against the three that only change
       what you are looking at. */
    .em-iconbtn--accent {
      background: var(--voice); border-color: var(--voice); color: var(--on-accent);
    }
    .em-iconbtn--accent:hover:not(:disabled) {
      background: var(--voice-hi); border-color: var(--voice-hi); color: var(--on-accent);
    }
    /* Busy state. An icon-only button has no room for "Checking…", so the
       glyph itself carries the progress. */
    .em-iconbtn--busy > svg { animation: em-spin 0.9s linear infinite; }
    @keyframes em-spin { to { transform: rotate(360deg); } }

    /* Buttons. The variants are additive classes so a call site reads as
       what it is (accent, danger, small) rather than as a ternary chain. */
    .em-pill {
      background: var(--raised);
      color: var(--text); border: 1px solid var(--line); border-radius: 10px;
      font-family: 'Instrument Sans', sans-serif; font-size: 13px; font-weight: 500;
      padding: 8px 18px; cursor: pointer; white-space: nowrap;
      transition: background 0.12s, border-color 0.12s, color 0.12s;
    }
    .em-pill:hover:not(:disabled) { border-color: var(--voice); color: var(--voice); }
    .em-pill--small { font-size: 12px; padding: 6px 14px; border-radius: 9px; }
    .em-pill--big   { font-size: 14px; font-weight: 600; padding: 11px 26px; }
    .em-pill--accent {
      background: var(--voice); color: var(--on-accent); border-color: var(--voice);
    }
    .em-pill--accent:hover:not(:disabled) {
      background: var(--voice-hi); border-color: var(--voice-hi); color: var(--on-accent);
    }
    .em-pill--danger {
      background: var(--error-bg); color: var(--error); border-color: var(--error-line);
    }
    .em-pill--danger:hover:not(:disabled) { border-color: var(--error); color: var(--error); }
    /* :disabled last so it wins over every variant without !important. */
    .em-pill:disabled {
      background: var(--surface);
      color: var(--muted); border-color: var(--line);
      cursor: not-allowed;
    }

    /* Bordered card grouping related controls. */
    .em-panel {
      background: var(--surface);
      border: 1px solid var(--line); border-radius: 14px;
      padding: 18px 22px 22px;
    }

    /* Small uppercase mono heading. */
    .em-label {
      font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: var(--muted);
      text-transform: uppercase; letter-spacing: 0.16em; margin-bottom: 12px;
    }

    /* Readout. Was a lit LCD tile; it is now a value in a column, because
       a number the eye has to find twice is not a readout. */
    .em-lcd {
      background: transparent;
      border: none; border-radius: 0;
      padding: 0; min-width: 54px;
    }
    .em-lcd__label {
      font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: var(--muted);
      text-transform: uppercase; letter-spacing: 0.16em; margin-bottom: 5px;
    }

    /* Inset region: the wizard transcript, the readout strips. A recessed
       surface rather than a lit panel — same job, no gradient. */
    .em-inset {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--em-inset-radius, 12px);
      padding: var(--em-inset-pad, 14px 18px);
    }

    /* Scrolling log/transcript output. This one stays dark in both themes —
       it is a console, and its role colours are the --console-* tokens. */
    .em-console {
      background: var(--console-bg);
      border: 1px solid var(--console-line); border-radius: 10px;
      color: var(--console-text);
      font-family: 'IBM Plex Mono', monospace; font-size: 11px; line-height: 1.85;
      padding: 14px 18px; overflow-y: auto;
    }
    .em-console__line--head {
      color: var(--console-media); letter-spacing: 0.12em; font-weight: 500;
      margin-top: 10px; padding-top: 6px;
      border-top: 1px solid var(--console-line-2);
    }
    .em-console__line--head:first-child { margin-top: 0; padding-top: 0; border-top: none; }
    .em-console__line--error { color: var(--console-error); }
    .em-console__line--ok    { color: var(--console-voice); }
    .em-console__line--warn  { color: var(--console-warn); }
    .em-console__line--wait  { color: var(--console-media); font-style: italic; }
    .em-console__line--adb   { color: var(--console-dim); font-size: 10px; }
    .em-console__line--detail { color: var(--console-text); opacity: 0.85; }
    .em-console__line--info  { color: var(--console-voice); }

    /* ── State ring ───────────────────────────────────────────────────
       The four motions of LedRing. Keyframes have to live here — an
       inline style object can name an animation but cannot define one.

       Each says one thing and says it slowly enough to be read across a
       room: rotation is listening, the core pulse is a turn in progress,
       the breath is something waiting for a person, the bars are music.
       All four stop under prefers-reduced-motion and freeze at 0.7
       opacity rather than vanishing, so a state that only motion
       distinguishes is still distinguishable. */
    @keyframes em-ring-spin { to { transform: rotate(360deg); } }
    @keyframes em-ring-pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50%      { opacity: 0.35; transform: scale(0.78); }
    }
    @keyframes em-ring-breathe {
      0%, 100% { opacity: 1; }
      50%      { opacity: 0.4; }
    }
    @keyframes em-ring-eq {
      0%, 100% { transform: scaleY(0.3); }
      50%      { transform: scaleY(1); }
    }
    @media (prefers-reduced-motion: reduce) {
      .em-iconbtn--busy > svg,
      .em-ring-spin, .em-ring-pulse, .em-ring-breathe, .em-ring-eq {
        animation: none !important; opacity: 0.7;
      }
    }

    /* Provisioning wizard chrome. */
    .em-wizard-progress { padding: 10px 14px 8px; border-bottom: 1px solid var(--border); }
    .em-wizard-progress__track {
      height: 3px; background: var(--track); border-radius: 2px; overflow: hidden;
    }
    .em-wizard-progress__fill {
      height: 100%; background: var(--voice); border-radius: 2px;
      transition: width 0.25s ease;
    }
    .em-wizard-progress__label {
      font-family: 'DM Mono', monospace; font-size: 8px; color: var(--muted);
      letter-spacing: 0.08em; text-transform: uppercase; margin-top: 6px;
    }
    .em-wizard-step {
      padding: 5px 12px; display: flex; align-items: flex-start; gap: 6px;
      border-left: 2px solid transparent;
    }
    .em-wizard-step--active {
      background: var(--surface); border-left-color: var(--voice);
    }
    .em-wizard-step--done   { opacity: 0.75; }
    .em-wizard-step--error  { border-left-color: var(--warn); }
    .em-wizard-step__num {
      font-family: 'DM Mono', monospace; font-size: 8px; color: var(--muted);
      flex-shrink: 0; width: 14px; padding-top: 1px;
    }
    .em-wizard-step__icon {
      font-family: 'DM Mono', monospace; font-size: 10px; flex-shrink: 0; width: 10px;
    }
    .em-wizard-step__label {
      font-family: 'DM Mono', monospace; font-size: 9px; letter-spacing: 0.04em;
      line-height: 1.4;
    }
    .em-wizard-step--active .em-wizard-step__label { color: var(--text); font-weight: 600; }
    .em-wizard-step--pending .em-wizard-step__label { color: var(--muted); }
    .em-wizard-status {
      display: flex; align-items: center; gap: 8px; margin-bottom: 10px;
      padding: 8px 12px; border-radius: 8px;
      background: var(--voice-bg);
      border: 1px solid var(--voice-line);
      font-family: 'DM Mono', monospace; font-size: 10px; color: var(--text2);
    }
    .em-wizard-status__dot {
      width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0;
      background: var(--voice);
      animation: em-wizard-pulse 1.4s ease-in-out infinite;
    }
    .em-wizard-status--wait .em-wizard-status__dot { background: var(--warn); }
    @keyframes em-wizard-pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.45; transform: scale(0.85); }
    }
    @media (prefers-reduced-motion: reduce) {
      .em-wizard-status__dot { animation: none; opacity: 0.7; }
    }
    .em-wizard-upcoming {
      margin-bottom: 12px; padding: 10px 12px;
      background: var(--surface); border: 1px solid var(--line);
      border-radius: 8px;
    }
    .em-wizard-upcoming__item { margin-top: 6px; }
    .em-wizard-upcoming__item:first-of-type { margin-top: 0; }
    .em-wizard-upcoming__name {
      font-family: 'DM Mono', monospace; font-size: 9px; color: var(--text2);
      letter-spacing: 0.06em; display: block;
    }
    .em-wizard-upcoming__desc {
      font-family: 'DM Mono', monospace; font-size: 9px; color: var(--muted);
      line-height: 1.5; display: block; margin-top: 2px;
    }
    .em-wizard-recovery { margin-bottom: 12px; }
    .em-wizard-recovery__hint {
      font-family: 'DM Mono', monospace; font-size: 10px; color: var(--text2);
      line-height: 1.6; margin: 0 0 10px;
    }
    .em-wizard-recovery__actions { display: flex; gap: 8px; flex-wrap: wrap; }

    /* Keyboard focus. Inline styles cannot express :focus-visible at all, so
       until now there was no focus ring anywhere in the dashboard. */
    .em-iconbtn:focus-visible,
    .em-pill:focus-visible {
      outline: 2px solid var(--voice); outline-offset: 2px;
    }

    /* Mobile layout — the dashboard is inline-styled, so phone-width
       adjustments live here as class-targeted media overrides (the classes
       are on the structural containers in dashboard.jsx). !important is
       required to beat the inline styles; keep these to layout only. */
    @media (max-width: 640px) {
      .em-page    { padding: 16px 12px 48px !important; }
      .em-header  { flex-wrap: wrap !important; gap: 10px !important; margin-bottom: 20px !important; }
      .em-summary { flex-wrap: wrap !important; }
      .em-summary > div { flex: 1 1 40% !important; }
      .em-summary > .em-summary-release { flex: 1 1 100% !important; }
      /* Modals go full-screen — the desktop frame is min(900px,95vw) ×
         min(700px,90vh), which leaves useless slivers of backdrop on a
         phone. 100dvh tracks the browser chrome collapsing on scroll. */
      .em-modal      { width: 100vw !important; height: 100dvh !important; border-radius: 0 !important; }
      .em-modal-head { padding: 12px 14px 0 !important; }
      .em-modal-headrow { flex-wrap: wrap !important; gap: 10px !important; }
      .em-modal-body { padding: 14px !important; }
      /* Two-column content grids stack on phones. */
      .em-grid2 { grid-template-columns: 1fr !important; }
    }
    /* Tab strips scroll horizontally instead of overflowing on any width. */
    .em-tabs { overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
    .em-tabs::-webkit-scrollbar { display: none; }
    .em-tabs > button { flex-shrink: 0; }
  </style>
  <script>
    // Set the theme BEFORE first paint. Done here, inline and synchronous,
    // rather than in React: the bundle is 200KB and loads at the end of
    // <body>, so a dark-mode user would get a full flash of the light
    // dashboard on every navigation.
    (function () {
      try {
        var saved = localStorage.getItem('em-theme');
        var theme = saved || (window.matchMedia &&
          window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', theme);
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    })();
  </script>
</head>
<body>
  <div id="root"></div>
  <link rel="stylesheet" href="static/vendor/xterm.css" />
  <script src="static/vendor/react.min.js"></script>
  <script src="static/vendor/react-dom.min.js"></script>
  <script src="static/vendor/xterm.js"></script>
  <script src="static/vendor/addon-fit.js"></script>
  <script src="static/dashboard.js"></script>
</body>
</html>
