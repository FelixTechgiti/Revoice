<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Revoice Device Management</title>
  <link rel="icon" type="image/svg+xml" href="static/favicon.svg" />
  <style>
    @font-face { font-family: 'Instrument Sans'; font-weight: 400 600; src: url('static/vendor/fonts/instrument-sans.woff2') format('woff2'); }
    @font-face { font-family: 'IBM Plex Mono'; font-weight: 400; src: url('static/vendor/fonts/plex-mono-400.woff2') format('woff2'); }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* The landing page carries its OWN tokens rather than sharing
       dashboard.html's: it is served before the bundle exists and must not
       depend on anything the dashboard loads. The values are the same, and
       the pair that matters is --voice and --bg — if this page ever drifts
       from the dashboard, the visible symptom is the colour changing as you
       sign in. */
    :root, :root[data-theme="light"] {
      --bg:          #f7f4ee;
      --surface:     #fffdf8;
      --raised:      #ebe6db;
      --line:        #ded7c9;
      --line-strong: #c9c1b0;
      --text:        #1b1a17;
      --text2:       #53504a;
      --muted:       #6d6860;
      --voice:       #0d6e4f;
      --voice-hi:    #0a5a41;
      --voice-bg:    #e4f0ea;
      --voice-line:  #b9d8ca;
      --warn:        #9a5a0c;
      --warn-bg:     #fdf6ea;
      --warn-line:   #e6d3b0;
      --error:       #a8372a;
      --on-accent:   #f7f4ee;
    }
    :root[data-theme="dark"] {
      --bg:          #12110f;
      --surface:     #1a1917;
      --raised:      #221f1c;
      --line:        #2c2926;
      --line-strong: #3a3632;
      --text:        #f2efe9;
      --text2:       #b8b2a8;
      --muted:       #a39c91;
      --voice:       #4ad9a4;
      --voice-hi:    #7ce9c0;
      --voice-bg:    #163026;
      --voice-line:  #24503f;
      --warn:        #e8a13c;
      --warn-bg:     #2a1d1a;
      --warn-line:   #4a2f28;
      --error:       #e8705c;
      --on-accent:   #0b1a14;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Instrument Sans', sans-serif;
      color: var(--text);
    }

    .frame {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 40px;
      width: 420px;
      max-width: 92vw;
    }
    @media (max-width: 480px) {
      .frame { padding: 28px 20px; }
    }

    /* The mark, as the wordmark rather than a picture of the hardware. The
       ring is the "o"; see controller/static/favicon.svg for why. */
    .brand {
      display: inline-flex; align-items: baseline; gap: 1px;
      font-size: 26px; font-weight: 600; letter-spacing: -0.04em;
      line-height: 1; color: var(--text); margin-bottom: 28px;
    }
    .brand svg { display: inline-block; vertical-align: baseline; }

    .langrow { display: flex; justify-content: flex-end; margin: -14px 0 18px; }
    .lang {
      display: inline-flex; background: var(--bg);
      border: 1px solid var(--line); border-radius: 8px; padding: 2px;
    }
    .lang button {
      background: transparent; border: none; border-radius: 6px; cursor: pointer;
      font-family: 'IBM Plex Mono', monospace; font-size: 11px;
      letter-spacing: 0.1em; padding: 4px 8px; color: var(--muted);
      transition: background 0.12s, color 0.12s;
    }
    .lang button[aria-pressed="true"] { background: var(--raised); color: var(--text); }

    /* The status strip replaces the LCD and the animated Dot. It carries
       exactly the states the script below already had — ready, first-run,
       unreachable — so the state machine is untouched; only what they look
       like changed. */
    .status {
      display: flex; align-items: center; gap: 10px;
      background: var(--voice-bg); border: 1px solid var(--voice-line);
      border-radius: 12px; padding: 12px 14px; margin-bottom: 26px;
    }
    .status__dot {
      width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
      background: var(--voice);
    }
    .status__text {
      font-family: 'IBM Plex Mono', monospace; font-size: 12px;
      color: var(--text2); line-height: 1.5; min-width: 0;
    }
    /* Amber and red are whole-strip states rather than a coloured word on a
       green ground: a first-run controller is not a ready one with a
       different sentence. */
    .status--warn  { background: var(--warn-bg); border-color: var(--warn-line); }
    .status--warn  .status__dot { background: var(--warn); }
    .status--error { background: var(--warn-bg); border-color: var(--warn-line); }
    .status--error .status__dot { background: var(--error); }

    form { display: none; }
    form.active { display: block; }

    .field { margin-bottom: 14px; text-align: left; }
    .field label {
      display: block;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 10px;
      color: var(--muted);
      letter-spacing: 0.16em;
      text-transform: uppercase;
      margin-bottom: 6px;
    }
    .field input {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--line-strong);
      border-radius: 10px;
      padding: 10px 13px;
      font-family: 'Instrument Sans', sans-serif;
      font-size: 14px;
      color: var(--text);
      caret-color: var(--voice);
      outline: none;
      transition: border-color 0.12s;
    }
    .field input:focus { border-color: var(--voice); }

    button[type=submit] {
      width: 100%;
      margin-top: 10px;
      background: var(--voice);
      border: 1px solid var(--voice);
      border-radius: 10px;
      padding: 12px;
      font-family: 'Instrument Sans', sans-serif;
      font-size: 14px;
      font-weight: 600;
      color: var(--on-accent);
      cursor: pointer;
      transition: background 0.12s, border-color 0.12s;
    }
    button[type=submit]:hover:not(:disabled) {
      background: var(--voice-hi); border-color: var(--voice-hi);
    }
    button[type=submit]:disabled { opacity: 0.55; cursor: default; }
    button[type=submit]:focus-visible { outline: 2px solid var(--voice); outline-offset: 2px; }

    .hint {
      font-family: 'Instrument Sans', sans-serif;
      font-size: 13px;
      color: var(--muted);
      margin-top: 18px;
      line-height: 1.6;
      text-wrap: pretty;
    }
    .hint code {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 12px;
      color: var(--text2);
      background: var(--raised);
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 2px 6px;
      display: inline-block;
      margin-top: 6px;
    }
  </style>
  <!-- The same strings the dashboard uses. This page loads no bundle, which
       is why they are a plain script rather than part of one. -->
  <script src="static/strings.js"></script>
  <script>
    // Set the theme BEFORE first paint, exactly as dashboard.html does. This
    // page is the first thing anyone sees, so a flash of the light card in
    // front of a dark-mode user is the first thing they see of the product.
    (function () {
      try {
        var saved = localStorage.getItem('em-theme');
        var theme = saved || (window.matchMedia &&
          window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', theme);
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    })();
  </script>
</head>
<body>
  <div class="frame">
    <div class="brand">
      <span>Rev</span>
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 72 72" width="21" height="21" aria-hidden="true">
        <circle cx="36" cy="36" r="28" fill="none" stroke="var(--voice)" stroke-width="14"
                stroke-dasharray="22 9" transform="rotate(-90 36 36)"/>
        <circle cx="36" cy="36" r="11" fill="var(--voice)"/>
      </svg>
      <span>ice</span>
    </div>

    <!-- The language segment sits with the mark rather than in a corner:
         on this page it is the only preference there is, and somebody who
         cannot read the form cannot find a control described in words they
         cannot read. -->
    <div class="langrow">
      <div class="lang" id="lang"></div>
    </div>

    <div class="status" id="status">
      <span class="status__dot"></span>
      <span class="status__text" id="status-text"></span>
    </div>

    <form id="form-setup" autocomplete="off">
      <div class="field">
        <label for="su-token"></label>
        <input id="su-token" type="text" spellcheck="false" autocomplete="off" />
      </div>
      <div class="field">
        <label for="su-user"></label>
        <input id="su-user" type="text" spellcheck="false" autocomplete="username" />
      </div>
      <div class="field">
        <label for="su-pass"></label>
        <input id="su-pass" type="password" autocomplete="new-password" />
      </div>
      <button type="submit" id="su-btn"></button>
    </form>

    <form id="form-login">
      <div class="field">
        <label for="li-user"></label>
        <input id="li-user" type="text" spellcheck="false" autocomplete="username" />
      </div>
      <div class="field">
        <label for="li-pass"></label>
        <input id="li-pass" type="password" autocomplete="current-password" />
      </div>
      <button type="submit" id="li-btn"></button>
    </form>

    <div class="hint" id="hint"></div>
  </div>
  <script>
    const strip     = document.getElementById('status');
    const stripText = document.getElementById('status-text');
    const hint      = document.getElementById('hint');

    // Tones, not hex. The strip is a themed element, so WHICH colour is the
    // stylesheet's business and the script only says which state it is in —
    // which is what makes the same code correct in both themes. The old
    // constants were four literals plus a text-shadow built by string
    // concatenation, and they were light-theme values on a dark panel.
    const OK = 'ok', WAIT = 'warn', BAD = 'error';

    // One setter where there were two. The ring and the readout always moved
    // together and the ring is gone, so a caller that set one and not the
    // other could only ever have been a bug waiting to happen.
    function setStatus(text, tone) {
      stripText.textContent = text;
      strip.className = 'status' + (tone === OK ? '' : ' status--' + tone);
    }

    const t = k => window.EM_I18N.t(k);

    // Every static label in one function, so a language change is a single
    // call rather than a list of assignments that can fall out of step. The
    // STATUS line is deliberately not touched here: it is the one piece of
    // text that says what just happened, and rewriting it on a language
    // change would replace an error message with a greeting.
    function paintLabels() {
      document.querySelector('label[for=su-token]').textContent = t('setupToken');
      document.querySelector('label[for=su-user]').textContent  = t('username');
      document.querySelector('label[for=su-pass]').textContent  = t('password');
      document.querySelector('label[for=li-user]').textContent  = t('username');
      document.querySelector('label[for=li-pass]').textContent  = t('password');
      document.getElementById('su-btn').textContent = t('createAdmin');
      document.getElementById('li-btn').textContent = t('signIn');
    }

    const langBox = document.getElementById('lang');
    window.EM_I18N.supported.forEach(l => {
      const b = document.createElement('button');
      b.type = 'button';
      b.textContent = l.toUpperCase();
      b.setAttribute('aria-pressed', String(l === window.EM_I18N.lang));
      b.addEventListener('click', () => window.EM_I18N.set(l));
      langBox.appendChild(b);
    });
    window.EM_I18N.subscribe(() => {
      langBox.querySelectorAll('button').forEach(b =>
        b.setAttribute('aria-pressed',
          String(b.textContent.toLowerCase() === window.EM_I18N.lang)));
      paintLabels();
    });
    paintLabels();
    setStatus(t('checkingController'), OK);

    function show(formId) {
      document.querySelectorAll('form').forEach(f =>
        f.classList.toggle('active', f.id === formId));
    }

    async function post(path, body) {
      const r = await fetch(path, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });
      const data = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(data.error || `HTTP ${r.status}`);
      return data;
    }

    // `via` records how the session was obtained — 'ingress' when Home
    // Assistant authenticated us, otherwise a password. The dashboard keys
    // its Sign out control on this rather than on whether the page happens to
    // be under ingress: those differ when Supervisor forwards no user and the
    // person falls back to the password form, and hiding Sign out from them
    // would be the broken-looking button the rule exists to prevent.
    function enterDashboard(token, role, via) {
      localStorage.setItem('em_token', token);
      localStorage.setItem('em_role', role);
      localStorage.setItem('em_auth_via', via || 'password');
      location.replace('dashboard');
    }

    // ── Setup form ──
    document.getElementById('form-setup').addEventListener('submit', async e => {
      e.preventDefault();
      const btn = document.getElementById('su-btn');
      btn.disabled = true;
      setStatus(t('creatingAccount'), WAIT);
      try {
        const d = await post('api/setup', {
          token:    document.getElementById('su-token').value.trim(),
          username: document.getElementById('su-user').value.trim(),
          password: document.getElementById('su-pass').value,
        });
        setStatus(t('accountCreated'), OK);
        enterDashboard(d.token, d.role);
      } catch (err) {
        setStatus(err.message, BAD);
        btn.disabled = false;
      }
    });

    // ── Login form ──
    document.getElementById('form-login').addEventListener('submit', async e => {
      e.preventDefault();
      const btn = document.getElementById('li-btn');
      btn.disabled = true;
      setStatus(t('signingIn'), OK);
      try {
        const d = await post('api/auth/login', {
          username: document.getElementById('li-user').value.trim(),
          password: document.getElementById('li-pass').value,
        });
        enterDashboard(d.token, d.role);
      } catch (err) {
        setStatus(err.message, BAD);
        btn.disabled = false;
      }
    });

    const isIngress = () => document.baseURI.includes('/hassio_ingress/');

    // ── Landing state machine ──
    // 1. Valid stored session → straight to /dashboard.
    // 2. Home Assistant already authenticated us → straight to /dashboard.
    // 3. Setup pending → amber ring + create-admin form.
    // 4. Configured → green ring + login form.
    async function init() {
      const token = localStorage.getItem('em_token');
      if (token) {
        try {
          const r = await fetch('api/auth/me',
            { headers: { Authorization: `Bearer ${token}` } });
          if (r.ok) { location.replace('dashboard'); return; }
        } catch {}
        localStorage.removeItem('em_token');
        localStorage.removeItem('em_role');
      }

      // Under the add-on, Home Assistant has already authenticated this
      // person and Supervisor forwards who they are — asking for a second
      // password would be a lock on a door that is already locked. Tried
      // after the stored session so an ordinary reload does not mint a new
      // one every time. A 401 is the normal answer off-ingress and simply
      // falls through to the forms below.
      try {
        const d = await post('api/auth/ingress', {});
        setStatus(t('signedInViaHa'), OK);
        enterDashboard(d.token, d.role, 'ingress');
        return;
      } catch {}

      try {
        const r = await fetch('api/system/setup-state');
        const d = await r.json();
        if (d.needs_setup) {
          setStatus(t('firstRunSetup'), WAIT);
          // Reaching this under ingress means Supervisor sent no user with
          // the session, so naming the container log would be wrong advice
          // on the one deployment that has no container log to read.
          hint.innerHTML = isIngress()
            ? t('haDidNotIdentify')
            : t('tokenInLogs') + '<br/>'
              + '<code>docker logs revoice-controller</code>';
          show('form-setup');
          document.getElementById('su-token').focus();
        } else {
          setStatus(t('readySignIn'), OK);
          hint.textContent = '';
          show('form-login');
          document.getElementById('li-user').focus();
        }
      } catch (e) {
        // Red, not amber. "The API is not answering" is a fault, and it used
        // to be the same colour as a first-run controller, which is
        // working perfectly and merely new.
        setStatus(t('apiUnreachable'), BAD);
        hint.textContent = String(e);
      }
    }

    init();
  </script>
</body>
</html>
