<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!--
    Revoice favicon — the LED ring, which is the "o" in the wordmark.

    It used to be a picture of an Echo Dot: a radial-gradient shell, a
    specular highlight, the ring's real LED colour. That was right while the
    product was "this piece of hardware"; the mark is now the ring itself,
    and the mark has to be the same thing everywhere it appears.

    A favicon is drawn at 16px more often than at any other size, so this is
    the SMALLEST optical step of the mark: a closed ring with the core
    punched out of the ground, rather than the segmented version. Segments
    at 16px are a smudge — they stop reading as a ring and start reading as
    a dotted circle, and the dots alias differently at every zoom level.

    Light tile rather than transparent, and the deep green rather than the
    bright one, so the mark has its own ground and survives both a light and
    a dark browser chrome. Those are --bg and --voice from the light theme
    (dashboard.html); this file cannot use var() — it is loaded as an icon,
    not as part of a document — so the two values are written out, and they
    are the one place in the tree where that is not a token violation.
  -->
  <rect width="64" height="64" rx="14.5" fill="#f7f4ee"/>
  <g transform="translate(8 8) scale(0.6667)">
    <circle cx="36" cy="36" r="27" fill="none" stroke="#0d6e4f" stroke-width="18"/>
    <circle cx="36" cy="36" r="9" fill="#f7f4ee"/>
  </g>
</svg>
