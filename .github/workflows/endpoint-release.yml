name: Endpoint Release (librespot + both shairport-syncs + nqptp + gaishim)

# Publishes the two streaming endpoint binaries as release assets, so the
# CONTROLLER can fetch and install them the way it fetches firmware — no file
# for anybody to upload by hand. That was the whole complaint: an OTA that
# needs somebody at a keyboard is not an OTA.
#
# Its own tag namespace, `endpoints-v*`, and that is load-bearing for the same
# reason emos-v* is. `em_api._fetch_latest_release` selects a tag starting `v`
# that carries a `server` asset; `endpoints-v1.0` matches neither test, so
# these releases cannot be mistaken for firmware by the OTA poller. Do not
# rename them into the `v*` space.
#
# ⚠ LICENCES. These are other people's programs and publishing their binaries
# carries obligations:
#
#   * librespot is MIT, and so is shairport-sync — this said GPLv2-or-later
#     until 2026-09-13 and that was simply wrong. shairport-sync carries an
#     MIT header in `shairport.c` (James Laird 2013, Mike Brady 2014--2026)
#     and an MIT `LICENSES` at its root; there is no GPL anywhere in it. The
#     error was conservative, promising more than was owed, which is exactly
#     why nothing ever caught it.
#   * **nqptp IS GPLv2, and it is the one asset here that is.** Checked at
#     tag 1.2.8: a `COPYING` that is GPL-2, and a per-file header saying
#     "version 2" with no or-later. So the correction above must not be read
#     as "these are all MIT" — it was about shairport-sync, and AirPlay 2
#     brought a second program with a different answer.
#
#     What GPLv2 asks of a binary release is the COMPLETE CORRESPONDING
#     SOURCE, which is a stronger duty than LGPL 6's relink offer below and
#     is discharged the same way: nqptp is built unmodified from the pinned
#     upstream tag, the shims linked into it are this repository's own MIT
#     code, and `device/shairport/ap2/in-container.sh` is the recipe. All of
#     it is public, at this release's commit. The notes say so in those
#     words rather than by implication, because a reader has to be able to
#     ACT on the offer.
#   * The obligation that IS real sits one layer down, in what the static
#     link pulls in: **libconfig v1.8.2 is LGPL-2.1**. LGPL §6 wants a user
#     to be able to relink against their own build of it, and what discharges
#     that is `device/shairport/build.sh` pinning it by tag and building it
#     from source — the recipe is the offer. Mbed TLS (Apache-2.0 of its
#     dual licence) and popt (MIT) need their notices carried and nothing
#     more.
#
# So the release body below names every licence in the binary, not just the
# program's own. That is the part not to drop when the notes get edited: for
# a static binary, attribution means everything inside it.
#
# The build is `endpoint-binaries.yml`'s, deliberately duplicated as a call
# rather than copied: the same build.sh in the same pinned compiler image, so
# a published binary is the one the dispatch build produces.

on:
  push:
    tags:
      - 'endpoints-v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7

      - name: Build librespot
        working-directory: device/librespot
        run: ./build.sh

      - name: Build shairport-sync
        working-directory: device/shairport
        run: ./build.sh

      # The AirPlay 2 receiver and its clock daemon, published BESIDE the
      # classic receiver rather than instead of it. They install to paths of
      # their own and the device runs whichever `airplay2Enabled` selects, so
      # a release carrying both is not a fleet-wide switch — it is the choice
      # existing, per device, with a rollback that costs no transfer.
      #
      # 120 minutes is the job's budget and this recipe is most of the reason:
      # six more cross-compiled dependencies than classic, ffmpeg among them.
      - name: Build shairport-sync (AirPlay 2) and nqptp
        working-directory: device/shairport
        run: ./build-ap2.sh

      # The resolver shim, which is ours rather than upstream's and is five
      # kilobytes against librespot's twenty megabytes. It is published here
      # rather than left to a manual upload because it is a PRECONDITION of
      # the two endpoints on emOS, not a choice beside them: a fleet that
      # fetched librespot automatically and needed a dashboard upload before
      # librespot could resolve a name would be a release that does not work.
      #
      # Its own build.sh runs the off-target checks and the ABI check first
      # and fails the job on either, so a shim that would load and interpose
      # nothing never reaches a release.
      - name: Build the resolver shim
        working-directory: device/gaishim
        # The NDK is NAMED here rather than left to build.sh's autodetect
        # search order, because abicheck.c is only meaningful against a known
        # set of Android headers — a search that finds a different NDK checks
        # the shim against headers nobody chose.
        #
        # It has to be a shell variable. The `env` context holds only what a
        # workflow, job or step `env:` block set, never the runner image's own
        # environment, so the `ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_LATEST_HOME }}`
        # that stood here until 2026-09-21 expanded to the empty string: the
        # line read as the mechanism selecting the NDK and selected nothing,
        # and every build ran on the autodetect instead. It never failed,
        # because the runner does ship an SDK the loop finds.
        #
        # The `:?` is what the old line could not do: if the image stops
        # setting the variable, the step says so here instead of quietly
        # building against whatever the search lands on.
        run: |
          : "${ANDROID_NDK_LATEST_HOME:?the runner image no longer sets it — name an NDK for this step}"
          echo "NDK: $ANDROID_NDK_LATEST_HOME"
          NDK="$ANDROID_NDK_LATEST_HOME" ./build.sh

      # ALL of them, or none. A release carrying some assets and not others
      # is one `em_endpoint_release.select()` refuses outright — deliberately,
      # so half a publish is never half adopted — which means a missing file
      # here does not degrade this release, it retires the automatic fetch for
      # every endpoint until the next one.
      - name: Every binary must be ARM
        run: |
          set -e
          for f in device/librespot/out/librespot \
                   device/shairport/out/shairport-sync \
                   device/shairport/out/shairport-sync-ap2 \
                   device/shairport/out/nqptp \
                   device/gaishim/out/gaishim.so; do
            if [ ! -f "$f" ]; then
              echo "::error::$f was not produced — a release needs both"
              exit 1
            fi
            desc="$(file -b "$f")"
            echo "$(basename "$f"): $desc"
            case "$desc" in
              *ARM*) ;;
              *) echo "::error::$f is not an ARM binary: $desc"; exit 1 ;;
            esac
          done

      # Every shared library a binary NEEDS has to exist on the device, and a
      # FireOS 6 /system is the smaller of the two: it carries no libandroid.so
      # and no libmediandk.so. Nothing in the build says otherwise — ffmpeg
      # enables jni and mediacodec by default for --target-os=android, they add
      # -landroid -lmediandk transitively, and the result links clean, strips
      # clean and dies at exec:
      #
      #   CANNOT LINK EXECUTABLE "shairport-sync-ap2": library "libandroid.so" not found
      #
      # That shipped (#297) and was found on a device rather than here, which
      # is what this step is for. An allowlist rather than a denylist, because
      # the next dependency to creep in will not be one of the two that already
      # did.
      - name: Every binary may only need libraries the device has
        run: |
          set -e
          allowed="libc.so libdl.so libm.so libz.so liblog.so libstdc++.so"
          fail=0
          for f in device/librespot/out/librespot \
                   device/shairport/out/shairport-sync \
                   device/shairport/out/shairport-sync-ap2 \
                   device/shairport/out/nqptp \
                   device/gaishim/out/gaishim.so; do
            needed="$(readelf -d "$f" | sed -n 's/.*(NEEDED).*\[\(.*\)\]/\1/p')"
            echo "$(basename "$f"): ${needed:-none}"
            for lib in $needed; do
              case " $allowed " in
                *" $lib "*) ;;
                *) echo "::error::$f needs $lib, which a FireOS /system does not carry"
                   fail=1 ;;
              esac
            done
          done
          [ "$fail" = 0 ] || exit 1

      # The notes carry the licence offer, so it travels with the artifact
      # rather than living only in a workflow comment.
      - name: Release notes
        run: |
          {
            echo "Streaming endpoint binaries for the Echo Dot"
            echo "(armv7a, Android API 22, built in the pinned compiler image)."
            echo
            echo "The controller fetches these itself and installs them on any"
            echo "device whose Spotify Connect or AirPlay toggle is on. Nothing"
            echo "here needs downloading by hand."
            echo
            echo "## Licences and source"
            echo
            echo "These are upstream programs, built unmodified except where"
            echo "the build recipe says otherwise. Both are statically linked,"
            echo "so the libraries inside them are listed too."
            echo
            echo "- **librespot** — MIT. Source: <https://github.com/librespot-org/librespot>."
            echo "  Build recipe and the exact tag: \`device/librespot/\`."
            echo "- **shairport-sync** — MIT. Source:"
            echo "  <https://github.com/mikebrady/shairport-sync>. Build recipe and"
            echo "  the exact tag: \`device/shairport/\`. Linked into it:"
            echo "  **Mbed TLS** v2.28.8 (Apache-2.0), **libconfig** v1.8.2"
            echo "  (LGPL-2.1-or-later) and **popt** 1.19 (MIT)."
            echo "- **shairport-sync-ap2** — the same program built with AirPlay 2,"
            echo "  so MIT as well, including the bundled \`pair_ap\` (MIT)."
            echo "  Everything above is linked into it, and in addition:"
            echo "  **libgcrypt** 1.12.4 and **libgpg-error** 1.61"
            echo "  (LGPL-2.1-or-later), **libplist** 2.7.0 (LGPL-2.1-or-later),"
            echo "  **libsodium** 1.0.22 (ISC) and **FFmpeg** n7.1.5"
            echo "  (LGPL-2.1-or-later — built without \`--enable-gpl\`, with only"
            echo "  the AAC and ALAC decoders enabled). Recipe:"
            echo "  \`device/shairport/ap2/in-container.sh\`."
            echo "- **nqptp** 1.2.8 — **GPL-2.0-only**. Source:"
            echo "  <https://github.com/mikebrady/nqptp>. This is the one binary"
            echo "  here under the GPL, and GPLv2 section 3 asks for the complete"
            echo "  corresponding source rather than the relink offer LGPL asks"
            echo "  for. It is all public and all at this release's commit:"
            echo "  nqptp is built **unmodified** from tag \`1.2.8\`; the recipe"
            echo "  that builds it is \`device/shairport/ap2/in-container.sh\`;"
            echo "  and the only other code inside the binary is this"
            echo "  repository's own \`device/shairport/compat/\` (MIT), which"
            echo "  supplies \`shm_open\` and pthread cancellation because bionic"
            echo "  has neither. Nothing is patched — the shims are injected"
            echo "  with \`-include\`, which is why the 1.2.8 pin still means"
            echo "  exactly what upstream published."
            echo
            echo "libconfig is LGPL and linked statically. LGPL-2.1 §6 asks that"
            echo "you be able to relink against your own build of it, and you can:"
            echo "\`device/shairport/build.sh\` pins it by tag and builds it from"
            echo "source, so substituting your own libconfig and rebuilding needs"
            echo "nothing from us that is not already in this repository."
            echo
            echo "The Android compat shims (\`device/librespot/ifaddrs_alias.c\` and"
            echo "\`device/shairport/compat/\`) are this repository's own code, MIT,"
            echo "and are compiled into these binaries. MIT is GPL-compatible, so"
            echo "the combined nqptp binary is conveyed under the GPL-2.0 above"
            echo "while the shim sources remain MIT where they live."
            echo
            echo "The corresponding source for every binary here is therefore the"
            echo "named upstream tags plus this repository at this release's commit."
            for f in device/librespot/out/librespot \
                     device/shairport/out/shairport-sync \
                     device/shairport/out/shairport-sync-ap2 \
                     device/shairport/out/nqptp \
                     device/gaishim/out/gaishim.so; do
              echo
              echo "\`\`\`"
              echo "$(basename "$f"): $(file -b "$f")"
              md5sum "$f"
              echo "\`\`\`"
            done
          } > /tmp/endpoint-notes.md
          cat /tmp/endpoint-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: Streaming endpoints ${{ github.ref_name }}
          files: |
            device/librespot/out/librespot
            device/shairport/out/shairport-sync
            device/shairport/out/shairport-sync-ap2
            device/shairport/out/nqptp
            device/gaishim/out/gaishim.so
          body_path: /tmp/endpoint-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
