name: Build a streaming endpoint binary

# librespot and shairport-sync are not in the firmware and not in any release:
# they are upstream programs the controller pushes onto a device, and neither
# project publishes an Android build. So somebody has to cross-compile them,
# and until now that somebody needed Docker on their own machine.
#
# This runs the SAME build.sh, in the same pinned compiler image, and hands
# back the binary as an artifact. Download it, then install it from the
# device's Updates tab → Streaming endpoints, which verifies the md5 on
# arrival and renames into place only on a match.
#
# It exists because the person who needs the binary is not always the person
# with a Docker daemon — and because a build nobody can run is how the
# librespot that could not advertise itself stayed on a device: rebuilding to
# test a fix was expensive enough to put off.

on:
  workflow_dispatch:
    inputs:
      which:
        description: Which endpoint to build
        type: choice
        # shairport-sync-ap2 is a SEPARATE option rather than a flag on
        # shairport-sync, mirroring build-ap2.sh being a separate script: the
        # two recipes share four library builds and differ in everything else,
        # and build.sh is the one currently being proven on hardware. It
        # produces TWO binaries, because AirPlay 2 needs a second process —
        # nqptp, which does PTP on UDP 319/320 and publishes the clock
        # shairport-sync reads through shared memory.
        options: [librespot, shairport-sync, shairport-sync-ap2, gaishim, both]
        default: librespot
        required: true
      ref:
        description: 'Upstream tag to build (librespot only; blank = the recipe default)'
        type: string
        required: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      # librespot's own build.sh checks its feature list against upstream's
      # Cargo.toml before spending the cross-compile — see the comment there.
      - name: Build librespot
        if: inputs.which == 'librespot' || inputs.which == 'both'
        working-directory: device/librespot
        run: ./build.sh ${{ inputs.ref }}

      - name: Build shairport-sync
        if: inputs.which == 'shairport-sync' || inputs.which == 'both'
        working-directory: device/shairport
        run: ./build.sh

      # NOT included in `both`. `both` means "the pair a device normally
      # runs", and a device runs one shairport-sync: whether it speaks
      # AirPlay 2 is a property of how that file was compiled, which is why
      # the firmware asks the binary rather than reading a config key. Putting
      # it in `both` would build two files that install to the same
      # destination and let whoever ran it pick by accident.
      #
      # 90 minutes is the job's budget and this recipe is the reason it is not
      # smaller: six more cross-compiled dependencies than classic, ffmpeg
      # among them.
      - name: Build shairport-sync (AirPlay 2) and nqptp
        if: inputs.which == 'shairport-sync-ap2'
        working-directory: device/shairport
        run: ./build-ap2.sh

      # In `both`, unlike the AirPlay 2 receiver, and for the opposite
      # reason: this is not a second file competing for one destination, it
      # is what BOTH endpoints need to resolve a name on emOS. Somebody
      # building the pair a device normally runs wants it in the same
      # artifact, and it costs seconds.
      - name: Build the resolver shim
        if: inputs.which == 'gaishim' || inputs.which == 'both'
        working-directory: device/gaishim
        # The NDK is NAMED here rather than left to build.sh's autodetect
        # search order, because abicheck.c is only meaningful against a known
        # set of Android headers — a search that finds a different NDK checks
        # the shim against headers nobody chose.
        #
        # It has to be a shell variable. The `env` context holds only what a
        # workflow, job or step `env:` block set, never the runner image's own
        # environment, so the `ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_LATEST_HOME }}`
        # that stood here until 2026-09-21 expanded to the empty string: the
        # line read as the mechanism selecting the NDK and selected nothing,
        # and every build ran on the autodetect instead. It never failed,
        # because the runner does ship an SDK the loop finds.
        #
        # The `:?` is what the old line could not do: if the image stops
        # setting the variable, the step says so here instead of quietly
        # building against whatever the search lands on.
        run: |
          : "${ANDROID_NDK_LATEST_HOME:?the runner image no longer sets it — name an NDK for this step}"
          echo "NDK: $ANDROID_NDK_LATEST_HOME"
          NDK="$ANDROID_NDK_LATEST_HOME" ./build.sh

      # What the ELF actually is, before anyone installs it. The controller's
      # upload endpoint checks this too and refuses a host build — the likely
      # mistake being a compile that succeeded against the wrong target — but
      # a build that produced an x86 binary should say so here rather than at
      # the dashboard, where it costs an upload first.
      - name: It has to be an ARM binary
        run: |
          set -e
          shopt -s nullglob
          found=0
          for f in device/librespot/out/librespot \
                   device/shairport/out/shairport-sync \
                   device/shairport/out/shairport-sync-ap2 \
                   device/shairport/out/nqptp \
                   device/gaishim/out/gaishim.so; do
            [ -f "$f" ] || continue
            found=1
            echo "### \`$(basename "$f")\`" >> "$GITHUB_STEP_SUMMARY"
            file "$f" | tee /tmp/desc
            if ! grep -q 'ARM' /tmp/desc; then
              echo "::error::$f is not an ARM binary — the Dot cannot exec it"
              exit 1
            fi
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            file -b "$f"       >> "$GITHUB_STEP_SUMMARY"
            md5sum "$f"        >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          done
          if [ "$found" = 0 ]; then
            echo "::error::the build produced no binary"
            exit 1
          fi
          echo "Install from the device's Updates tab → Streaming endpoints." \
            >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: endpoint-binaries
          # The md5 rides along: it is the only identity either end can agree
          # on for an upstream program with no version string of ours in it.
          path: |
            device/librespot/out/*
            device/shairport/out/*
            device/gaishim/out/*
          if-no-files-found: error
          retention-days: 30
